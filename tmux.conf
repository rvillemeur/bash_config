#bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-j) || tmux select-pane -D"
#bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-k) || tmux select-pane -U"
#bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys C-l) || tmux select-pane -R"
#bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|n?vim?)(diff)?$' && tmux send-keys 'C-\\') || tmux select-pane -l"

## restoring clear screen
bind C-l send-keys 'C-l'

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse mode
#setw -g mode-mouse on
#set -g mouse-select-pane on
#set -g mouse-resize-pane on
#set -g mouse-select-window on

# une ligne de statut
set -g status on

# Rafraîchissement toutes les 5 secondes
set -g status-interval 5

# Layout personnalisé : fenêtres à gauche, Claude au centre, infos à droite
# Remplace le format par défaut de la barre de statut globale (il peut y en avoir plusieurs, indexées à partir de 0).
# #[align=left range=left]│ Aligne à gauche et déclare une zone cliquable nommée left (utilisée par la souris)
# #{E:status-left}		  │ Évalue et insère le contenu de l'option status-left (le E: force la double évaluation des variables imbriquées)
# #[norange default]	  │ Ferme la zone cliquable et remet le style par défaut
# #[list=on align=left]	  │ Active la liste des fenêtres et l'aligne à gauche
# #{W:#{E:window-status-format},#{E:window-status-current-format}} │ W: itère sur toutes les fenêtres : utilise window-status-format pour les    inactives, window-status-current-format pour la fenêtre active
# #[nolist]				  | Ferme la liste des fenêtres
# #[align=centre]		  │ Centre ce qui suit
# #(~/.claude/tmux-claude-status.sh) │ Exécute le script shell et insère son output — c'est ici que le statut Claude apparaît, au centre
# #[align=right range=right]│ Aligne à droite et déclare la zone cliquable right
# #{E:status-right}         │ Évalue et insère status-right (heure, hostname, etc.)
# │ #[norange default]      │ Ferme la zone et remet le style par défaut

# ---------------------------------------------------------------------------
# tmux format quirks worth remembering. All three of them bit this config.
#
# 1. A conditional splits on its first unescaped comma.
#    #{?cond,a,b} is cut into branches by scanning for commas, and that scan
#    runs before any #[] styling is interpreted. One "#[fg=x,bg=y]" inside a
#    branch therefore ends the conditional early and the rest is dropped with
#    no error -- usually the whole segment just renders blank. Inside a
#    conditional, always use one #[] directive per attribute:
#        #[fg=#82aaff]#[bg=default]    not    #[fg=#82aaff,bg=default]
#    This also applies to strings a plugin substitutes into a conditional of
#    its own, which is why @mode_indicator_*_prompt below is written that way.
#
# 2. An #[align=...] block gets its outer ASCII whitespace trimmed.
#    A plain leading or trailing space at the edge of an aligned block is
#    removed, so padding written there never appears. Use a non-breaking space
#    (U+00A0) instead: tmux keeps it, because it is a printable character.
#    tmux-claude-status.sh pads the centred Claude group exactly that way.
#
# 3. window-status-separator is inert once status-format[0] is overridden.
#    The default status bar inserts that separator itself; a custom #{W:...}
#    block does not. Each window format below therefore carries its own
#    trailing space and restates its colours, because nothing around the
#    format can do it for them.
# ---------------------------------------------------------------------------

#  En résumé, la barre est découpée en trois parties :
#  - Gauche : status-left + liste des fenêtres
#  - Centre : output du script Claude
#  - Droite : status-right
# set -g status-format[0] "#[align=left range=left]#{E:status-left}#[norange default]#[list=on align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[nolist]#[align=centre]#(~/.claude/tmux-claude-status.sh)#[align=right range=right]#{E:status-right}#[norange default]"
set -g status-format[0] "#[list=on align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[nolist]#[align=centre]#(~/.claude/tmux-claude-status.sh)#[align=right range=right]#{E:status-right}"

# status bar Appearance
# tokyonight-moon palette, mirrored from the tokyo-night-tmux plugin so the
# status bar keeps that look without the plugin (which overwrote status-right).
#   background #222436   foreground #828bb8   bblack #444a73
#   blue       #82aaff   green      #4fd6be   yellow #e0af68
set -g status-style 'fg=#828bb8,bg=#222436'
set -g status-left-length 40
# set -g status-left "#[fg=cyan]Window:#I #[fg=blue]Pane:#P"
set -g status-left ''
set -g status-justify left
set -g status-right-length 100
# Right side, built out of rounded pills: each segment carries its own caps and
# its own trailing space, so an inactive one vanishes completely instead of
# leaving a stray separator behind.
#   - battery  : only while discharging, see tmux-battery.sh
#   - mode      : tmux-mode-indicator, restyled into a pill just below
#   - pomodoro : only while a timer runs, see tmux-pomodoro.sh
#   - clock     : always on, closes the bar
set -g status-right "#(~/devzone/bash_config/tmux-battery.sh)#{tmux_mode_indicator} #(~/devzone/bash_config/tmux-pomodoro.sh)#[fg=#444a73,bg=#222436]#[fg=#828bb8,bg=#444a73] 󰅐 %d %b %R #[fg=#444a73,bg=#222436] "

# tmux-mode-indicator as a pill. The plugin emits its own style before the
# prompt, so each prompt restates the colours it wants: cap, body, cap.
# One #[] directive per attribute, never "fg=x,bg=y": the prompt lands inside
# a #{?...} conditional of the plugin's own, so quirk 1 above applies.
set -g @mode_indicator_empty_prompt  "#[fg=#86e1fc]#[bg=#222436]#[fg=#222436]#[bg=#86e1fc] TMUX #[fg=#86e1fc]#[bg=#222436]"
set -g @mode_indicator_prefix_prompt "#[fg=#82aaff]#[bg=#222436]#[fg=#222436]#[bg=#82aaff] WAIT #[fg=#82aaff]#[bg=#222436]"
set -g @mode_indicator_copy_prompt   "#[fg=#e0af68]#[bg=#222436]#[fg=#222436]#[bg=#e0af68] COPY #[fg=#e0af68]#[bg=#222436]"
set -g @mode_indicator_sync_prompt   "#[fg=#ff757f]#[bg=#222436]#[fg=#222436]#[bg=#ff757f] SYNC #[fg=#ff757f]#[bg=#222436]"

# Pad the pomodoro glyph away from the countdown; tmux-pomodoro.sh trims the
# outer spaces and supplies the pill.
set -g @pomodoro_on " 🍅 "
set -g @pomodoro_complete " ✅ "

# window appearance
# conflict with terminal color scheme and thus with character display
# be prepared to tweak the color if you switch your color scheme
# here, we keep active default terminal color for foreground and background
# for inactive windows, we keep the foreground, but change the background
# Pane background, synced with neovim tokyonight-moon palette.
# Active pane   = tokyonight-moon 'bg'           #222436
# Inactive pane = tokyonight-moon 'bg_highlight' #2f334d
# neovim repaints its whole pane, so it cannot rely on window-style: it mirrors
# these two colors itself in ~/.config/nvim/lua/config/autocmds.lua, driven by
# FocusGained / FocusLost. That requires 'focus-events on' below.

set -g window-style 'fg=terminal,bg=#2f334d'
set -g window-active-style 'fg=terminal,bg=#222436'
#set -g @tokyo-night-tmux_theme moon   # night (default) | storm | moon | day
# set -g @tokyo-night-tmux_transparent 1 # transparent background
#set -g @tokyo-night-tmux_show_git 1             # local git status
#set -g @tokyo-night-tmux_show_battery_widget 1  # battery level
#set -g @tokyo-night-tmux_show_music 1           # now playing
#set -g @tokyo-night-tmux_show_path 1            # current path
#set -g @tokyo-night-tmux_show_hostname 1        # machine hostname

# Window list, one rounded pill per window, the same shape as the status-right
# segments and the pane badge:
#   - current window : bblack  #444a73 block, bright text, green marker
#   - other windows  : bg_highlight #2f334d block, dim foreground, no marker
# The caps are  (U+E0B6) and  (U+E0B4); the other Nerd Font glyphs
# are the ssh icon and the last-window icon. Each pill ends with a trailing
# space of its own -- see quirk 3 above -- and that space is outside the cap,
# so it is painted in the bar colour and the pills stay visually separate.
set -g window-status-style dim
set -g window-status-separator ''
set -g window-status-format "#[nobold]#[nodim]#[fg=#2f334d]#[bg=#222436]#[fg=#828bb8]#[bg=#2f334d]#{?#{==:#{pane_current_command},ssh},󰣀 ,  }#I:#W#[dim]#{?window_zoomed_flag, Z,}#[fg=#e0af68]#{?window_last_flag, 󰁯,} #[nodim]#[fg=#2f334d]#[bg=#222436] "
set -g window-status-current-style bold
set -g window-status-current-format "#[nobold]#[nodim]#[fg=#444a73]#[bg=#222436]#[fg=#4fd6be]#[bg=#444a73]#{?#{==:#{pane_current_command},ssh},󰣀 ,● }#[fg=#c8d3f5]#[bold]#I:#W#[nobold]#{?window_zoomed_flag, Z,} #[fg=#444a73]#[bg=#222436] "
#set -g window-option 'xterm-keys on'

# message appearance
set -g message-style fg=white
set -g message-style bg=black
set -g message-style bright


# pane appearance configuration
set -g pane-border-lines single
set -g pane-active-border-style 'fg=#82aaff,bg=default'
set -g pane-border-style 'fg=#444a73,bg=default'
# Bottom border on, but with an empty format: no pane badge (the active border
# colour already says which pane has focus), just the plain rule, which keeps
# the pane content off the status line.
set -g pane-border-format ""
set -g pane-border-status bottom


# display pane number for 3 second (prefix q)
set-option -g display-panes-time 3000

# solarized color theme
set -g @sidebar-tree-command 'tree -C'

# Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle


#set terminal as 256 color
# set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"
# truecolor passthrough: without it the #rrggbb pane styles above are rounded to
# the 256 color cube and no longer match neovim's own background
set -ga terminal-features ",*:RGB"
# tell the application (neovim) when its pane gains or loses focus
set -g focus-events on

#sync tmux with system clipboard
set -g set-clipboard on

# source bashrc
set-option -g default-shell "/bin/bash"

#avoid login shell
set -g default-command "${SHELL}"

setw -g monitor-activity on
set -g visual-activity on
 set -as terminal-overrides ",*:U8=0"

# start window numbering at 1 instead of 0
set -g base-index 1
set -g renumber-windows on

# start pane numbering at 1 instead of 0
set -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'christoomey/vim-tmux-navigator'
# tokyo-night-tmux is deliberately NOT enabled: it overwrites status-left,
# status-right and window-status-format at load time, which wipes the
# mode-indicator / pomodoro / battery segments configured above.
# set -g @plugin "janoamaral/tokyo-night-tmux"
# we don't need to force tmux color. Better used terminal color scheme
set -g @plugin 'tmux-plugins/tmux-resurrect'

# set active tmux session ON or OFF,  usefull when dealing with nested session
# source https://gist.github.com/samoshkin/05e65f7f1c9b55d3fc7690b59d678734
bind -n F12  \
  set prefix None \;\
  set key-table off \;\
  set status-bg red \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set status-bg black

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
